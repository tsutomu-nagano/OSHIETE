<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>e-Stat 初心者モード</title><link rel="stylesheet" href="popup.css">
</head>
<body><main>
  <h1>OSHIETE</h1>

  <p class="count">このページで検出した用語：<strong id="term-count">—</strong>件</p>

  <button id="open-glossary" class="glossary-button" type="button">登録用語一覧を見る</button>
  <button id="start-tour" class="tour-button" type="button">▶ e-Statの使い方ツアー</button>
  <p id="notice" class="notice" aria-live="polite"></p>
</main><script src="popup.js"></script></body>
